# tmux. Prefix is the default Ctrl-b. Key list: docs/tmux.md, or Ctrl-b ?

# General
set -g mouse on                 # click panes, drag borders, scroll history
set -g base-index 1             # windows start at 1, like the keyboard
setw -g pane-base-index 1
set -g renumber-windows on      # no gaps after closing a window
set -g history-limit 50000
set -sg escape-time 10          # no lag after Esc (nvim)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

# Claude Code inside tmux: Shift+Enter, notifications, progress
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Keys (arrows, z, x, 1-9, comma, d, s and ? are tmux defaults)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Catppuccin Mocha. The session name turns yellow while Ctrl-b is waiting for a key.
set -g status-style "bg=#181825,fg=#a6adc8"
set -g status-left "#{?client_prefix,#[bg=#f9e2af],#[bg=#cba6f7]}#[fg=#1e1e2e,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#7f849c]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#fab387,bold] #I #W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
