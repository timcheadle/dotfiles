# tmux. Prefix is the default Ctrl-b. Key list: docs/tmux.md, or Ctrl-b ?

# General
set -g mouse on                 # click panes, drag borders, scroll history
set -g base-index 1             # windows start at 1, like the keyboard
setw -g pane-base-index 1
set -g renumber-windows on      # no gaps after closing a window
set -g history-limit 50000
set -sg escape-time 10          # no lag after Esc (nvim)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

# Claude Code inside tmux: Shift+Enter, notifications, progress
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Keys (arrows, z, x, 1-9, comma, d, s and ? are tmux defaults)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Rosé Pine Moon. The session name turns gold while Ctrl-b is waiting for a key.
set -g status-style "bg=#2a273f,fg=#908caa"
set -g status-left "#{?client_prefix,#[bg=#f6c177],#[bg=#c4a7e7]}#[fg=#232136,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#6e6a86]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#232136,bg=#ea9a97,bold] #I #W "
set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#c4a7e7"
set -g message-style "bg=#393552,fg=#e0def4"
set -g mode-style "bg=#44415a,fg=#e0def4"
