# Two-line prompt. Only the modules listed in `format` are shown,
# so slow ones (language versions, cloud) stay off.
"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
palette = "catppuccin-mocha"
format = "$time$directory$git_branch$git_status$cmd_duration$line_break$character"

[time]
disabled = false
style = "overlay1"
format = "[$time]($style) "
time_format = "%H:%M"

[directory]
style = "bold teal"
truncation_length = 4
truncate_to_repo = false

[cmd_duration]
style = "yellow"
min_time = 2_000  # only show for commands that take 2s or more
format = "took [$duration]($style) "

[git_branch]
style = "bold mauve"

[git_status]
style = "red"

# ❯ changes colour when the last command failed
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Catppuccin Mocha: https://catppuccin.com/palette
[palettes.catppuccin-mocha]
base = "#1e1e2e"
text = "#cdd6f4"
overlay1 = "#7f849c"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
blue = "#89b4fa"
mauve = "#cba6f7"
